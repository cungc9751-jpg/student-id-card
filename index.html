<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

.card{
  width:90%;
  max-width:360px;
  background:white;
  border-radius:20px;
  overflow:hidden;
  text-align:center;
}

.header{
  background:#2563eb;
  height:90px;
}

img{
  width:120px;
  height:120px;
  border-radius:50%;
  margin-top:-60px;
  border:4px solid white;
  object-fit:cover;
}

h2{ margin:10px 0; }
p{ margin:5px; color:#555; }
</style>
</head>

<body>

<div class="card">
  <div class="header"></div>

  <img src="https://via.placeholder.com/120">

  <h2>Student Name</h2>
  <p>Class: 10</p>
  <p>ID: 001</p>
</div>

</body>
</html>
