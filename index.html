<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background:#0f172a;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
}

.card{
  width:90%;
  max-width:360px;
  background:white;
  border-radius:20px;
  text-align:center;
  padding:20px;
}

img{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #2563eb;
}

h2{ margin:10px 0 5px; }
p{ margin:4px; color:#555; }
</style>
</head>

<body>

<div id="app">Loading...</div>

<script>
fetch("YOUR_API_LINK")
.then(res => res.json())
.then(data => {

  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get("id");

  const student = data.find(s => s.student_id == id);

  if(student){
    document.getElementById("app").innerHTML = `
      <div class="card">
        <img src="${student.photo}">
        <h2>${student.name}</h2>
        <p>ID: ${student.student_id}</p>
        <p>Class: ${student.class}</p>
        <p>Date: ${student.date}</p>
      </div>
    `;
  } else {
    document.getElementById("app").innerHTML = "Not Found";
  }

});
</script>

</body>
</html>
